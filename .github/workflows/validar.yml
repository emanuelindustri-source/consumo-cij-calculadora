name: Validar web, idiomas y motor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Catalogo, web y pruebas del motor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Catalogo, copias web, assets, parrafos traducibles y HTML
        run: python tools/check_i18n.py

      - name: Pruebas del motor de calculo (valores de referencia)
        run: node tools/test_engine.js

      - name: Comprobar que la app no usa red
        run: |
          if grep -rn "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "::error::La app no debe declarar INTERNET"
            exit 1
          fi
          echo "OK: sin permisos de red"
