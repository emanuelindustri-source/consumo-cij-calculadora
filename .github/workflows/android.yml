name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Instalar plataforma y build-tools 34 si faltan
        run: |
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMAN" ]; then
            yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
            "$SDKMAN" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          else
            echo "sdkmanager no disponible; se usará el SDK del runner"
          fi

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar que la app no usa red
        run: |
          if grep -rn "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "::error::La app no debe declarar INTERNET"
            exit 1
          fi
          echo "OK: sin permisos de red"

      - name: Verificar web autónoma (sin dependencias externas)
        run: |
          python3 - <<'PY'
          import re, sys
          html = open('web/calculadora-offline.html', encoding='utf-8').read()
          refs = re.findall(r'(?:src|href)\s*=\s*["\'](https?://[^"\']+)', html, re.I)
          refs += re.findall(r'@import\s+url\((https?://[^)]+)\)', html, re.I)
          bad = [r for r in refs if 'w3.org' not in r]
          if bad:
              print('URLs externas encontradas:', bad[:5])
              sys.exit(1)
          print('OK: web sin dependencias externas')
          PY

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: consumo-cij-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
